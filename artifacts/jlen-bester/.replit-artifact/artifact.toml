kind = "web"
previewPath = "/"
title = "J'Len Bester, J.D."
description = "A professional single-page resume website for J'Len Bester, J.D., highlighting legal and communications experience, education, leadership, skills, and contact information."
version = "1.0.0"
id = "artifacts/jlen-bester"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21564

[services.development]
run = "pnpm --filter @workspace/jlen-bester run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jlen-bester", "run", "build" ]
serve = "static"
publicDir = "artifacts/jlen-bester/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21564"
BASE_PATH = "/"
